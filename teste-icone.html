<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="apple-touch-icon" sizes="180x180" href="icone-ios-v2.png?v=2"><title>Teste do ícone</title>
<style>body{font-family:system-ui;padding:20px;line-height:1.5}img{width:120px;border-radius:24px;border:1px solid #ccc}b.ok{color:#0a7a2f}b.err{color:#c00}</style></head><body>
<h2>Teste do ícone</h2><div id="r">Verificando...</div>
<script>
const l=[...document.querySelectorAll('link[rel^="apple-touch-icon"]')];
let h='<p>Linhas apple-touch-icon nesta página: <b>'+l.length+'</b></p>';
const urls=['icone-ios-v2.png','apple-touch-icon.png','manifest.json','index.html'];
Promise.all(urls.map(u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>({u,ok:r.ok,s:r.status})).catch(()=>({u,ok:false,s:'falhou'})))).then(rs=>{
 rs.forEach(r=>h+='<p>'+r.u+': <b class="'+(r.ok?'ok':'err')+'">'+(r.ok?'OK':'ERRO '+r.s)+'</b></p>');
 fetch('index.html?t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{h+='<p>index.html publicado tem a linha do ícone: <b class="'+(t.includes('icone-ios-v2.png')?'ok':'err')+'">'+(t.includes('icone-ios-v2.png')?'SIM':'NÃO (arquivo antigo)')+'</b></p><img src="icone-ios-v2.png?v=2" alt="">';document.getElementById('r').innerHTML=h;});
});
</script></body></html>
