<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de notificações</title>
<style>body{font-family:system-ui,sans-serif;padding:18px;line-height:1.5;max-width:560px;margin:auto}p{margin:.4em 0}button{margin-top:14px;padding:12px 16px;border:0;border-radius:12px;background:#0056b3;color:#fff;font-weight:700;font-size:1rem}small{color:#666}</style></head>
<body>
<h2>🔔 Teste de notificações</h2>
<div id="r"></div>
<button id="b" type="button">Ativar notificações</button>
<p><small>Tire uma captura desta tela e envie se algum item aparecer com ❌.</small></p>
<script>window.OneSignalDeferred = window.OneSignalDeferred || [];</script>
<script src="push.js"></script>
<script>
const r = document.getElementById('r');
const L = (ok, t) => r.insertAdjacentHTML('beforeend', '<p>' + (ok === null ? 'ℹ️' : ok ? '✅' : '❌') + ' ' + t + '</p>');
(async () => {
  const id = (typeof PUSH_APP_ID !== 'undefined') ? PUSH_APP_ID : '';
  const idOk = !!id && !id.startsWith('COLE-AQUI');
  L(idOk, idOk ? 'App ID configurado no push.js (' + id.slice(0, 8) + '…)' : 'App ID NÃO configurado: ainda está "COLE-AQUI-O-APP-ID" no push.js');
  const suporta = 'Notification' in window;
  L(suporta, suporta ? 'Este navegador suporta notificações' : 'Sem suporte aqui. No iPhone: adicione o app à Tela de Início e abra por lá (iOS 16.4+)');
  L(null, 'Aberto como app instalado: ' + ((matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) ? 'sim' : 'não (no iPhone precisa ser sim)'));
  L(null, 'Permissão atual: ' + (suporta ? Notification.permission : 'n/d') + ' (precisa virar "granted")');
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    L(regs.length > 0, 'Service worker: ' + (regs.length ? regs.map(g => g.scope + ' → ' + (g.active ? g.active.scriptURL.split('/').pop() : 'sem ativo')).join(' | ') : 'nenhum registrado'));
  } catch (e) { L(false, 'Service worker indisponível: ' + e.message); }
  let sdk = false;
  OneSignalDeferred.push(async function (OneSignal) {
    sdk = true; L(true, 'SDK do OneSignal carregou');
    try {
      const ps = OneSignal.User.PushSubscription;
      L(!!ps.id, 'ID da inscrição: ' + (ps.id || 'ainda não existe (ative as notificações)'));
      L(!!ps.optedIn, 'Inscrito para receber: ' + (ps.optedIn ? 'sim' : 'não'));
    } catch (e) { L(false, 'Erro lendo a inscrição: ' + e.message); }
  });
  setTimeout(() => { if (!sdk) L(false, 'SDK do OneSignal NÃO carregou (App ID vazio/inválido, internet ou bloqueador de anúncios)'); }, 7000);
})();
document.getElementById('b').onclick = () => {
  if (window.cieescPush) { cieescPush.ativar(); setTimeout(() => location.reload(), 4000); }
  else alert('O App ID ainda não foi configurado no push.js.');
};
</script></body></html>
